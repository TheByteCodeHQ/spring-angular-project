spring:
  application:
    name: task-service
  jpa:
    open-in-view: false            # no lazy loading from the web layer
    hibernate:
      ddl-auto: validate           # the schema is owned by Flyway, Hibernate only checks it
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never         # never leak internals in error bodies
    include-stacktrace: never
    include-binding-errors: never
  compression:
    enabled: true

app:
  jwt:
    secret: ${APP_JWT_SECRET:}     # required, at least 32 characters; there is no default on purpose
    issuer: ${APP_JWT_ISSUER:task-service}
    ttl: 1h
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:}   # comma separated, for example https://app.example.com

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true              # /actuator/health/liveness and /readiness for Kubernetes
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"  # every log line carries the request id
