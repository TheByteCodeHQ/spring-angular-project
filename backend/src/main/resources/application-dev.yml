# Local development: in-memory database and a built-in token endpoint. Never use this profile in production.
spring:
  datasource:
    url: jdbc:h2:mem:tasks;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

app:
  jwt:
    secret: dev-only-secret-change-me-0123456789abcdef
  cors:
    allowed-origins: http://localhost:4200
