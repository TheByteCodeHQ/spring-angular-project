server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  # The API lives behind the same origin, so the browser needs no CORS and the backend is never exposed directly
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Hashed assets can be cached for a year; index.html must always be revalidated
  location ~* \.(js|css|ico)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;   # single-page app: unknown paths go to the router
  }
}
